<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comprehension questions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<script src="auth-guard.js"></script>
</head>
<body>
<nav class="top-links"><a href="index.html">Fixture site index</a></nav>

<header class="page-header">
  <h1>Comprehension questions</h1>
  <p>Answer all five questions about the passage you just read, then submit.</p>
</header>

<main>
  <form id="questionsForm">
    <div id="questionsContainer"></div>
    <p><button type="button" id="submitBtn" class="btn" disabled>Submit</button></p>
  </form>
</main>

<script src="questions-data.js"></script>
<script src="round-nav.js"></script>
<script>
(function () {
  "use strict";

  var params = new URLSearchParams(window.location.search);

  var setId = params.get("set");
  if (!QUESTION_SETS.hasOwnProperty(setId)) {
    setId = "1";
  }

  var round = parseInt(params.get("round"), 10);
  if (isNaN(round) || round < 1) {
    round = 1;
  }

  var questions = QUESTION_SETS[setId];
  var container = document.getElementById("questionsContainer");
  var answers = {};

  questions.forEach(function (q, qi) {
    var fieldset = document.createElement("fieldset");
    fieldset.className = "question-block";
    fieldset.setAttribute("data-qid", q.id);

    var legend = document.createElement("legend");
    legend.textContent = (qi + 1) + ". " + q.question;
    fieldset.appendChild(legend);

    q.options.forEach(function (opt) {
      // Deliberately keep the <label> as a SEPARATE sibling of the
      // <input>, not wrapped around it, so element-inventory code has to
      // associate them via the sibling relationship / the `for` attribute
      // rather than by walking up into a parent <label>.
      var row = document.createElement("div");
      row.className = "option-row";

      var input = document.createElement("input");
      input.type = "radio";
      input.name = q.id;
      input.id = q.id + "-" + opt.id;
      input.value = opt.id;

      var label = document.createElement("label");
      label.setAttribute("for", input.id);
      label.textContent = opt.text;

      row.appendChild(input);
      row.appendChild(label);
      fieldset.appendChild(row);

      input.addEventListener("change", function () {
        answers[q.id] = opt.id;
        updateSubmitState();
      });
    });

    container.appendChild(fieldset);
  });

  var submitBtn = document.getElementById("submitBtn");

  function updateSubmitState() {
    submitBtn.disabled = Object.keys(answers).length < questions.length;
  }

  submitBtn.addEventListener("click", function () {
    if (submitBtn.disabled) {
      return;
    }

    var correctCount = 0;
    questions.forEach(function (q) {
      if (answers[q.id] === q.correct) {
        correctCount++;
      }
    });

    var earned = correctCount * POINTS_PER_CORRECT;

    var current = 0;
    try {
      current = parseInt(sessionStorage.getItem("spark_fixture_score"), 10) || 0;
    } catch (e) {
      current = 0;
    }

    var newTotal = current + earned;

    try {
      sessionStorage.setItem("spark_fixture_score", String(newTotal));
    } catch (e) {
      // sessionStorage unavailable (e.g. private-mode edge case); the score
      // page will just show 0, which is an acceptable degradation for a
      // test fixture with no real backend.
    }

    window.location.href = "score.html?round=" + round;
  });
})();
</script>
</body>
</html>
