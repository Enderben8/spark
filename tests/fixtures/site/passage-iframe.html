<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Founding of Millbrook (iframe)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<script src="auth-guard.js"></script>
</head>
<body>
<nav class="top-links"><a href="index.html">Fixture site index</a></nav>

<header class="page-header">
  <h1>The Founding of Millbrook</h1>
  <p><em>The passage below is embedded from passage.html in a same-origin
     &lt;iframe&gt;, rather than being rendered directly in this page's
     DOM.</em></p>
</header>

<main>
  <iframe id="passageFrame" title="Passage" style="width:100%; height:80vh; min-height:600px; border:1px solid #d0d0d0;"></iframe>
</main>

<script>
(function () {
  "use strict";
  // Propagate this page's own query string (round, nologin, etc.) into the
  // embedded passage so the iframe behaves consistently with a direct visit.
  var params = new URLSearchParams(window.location.search);
  var qs = params.toString();
  var frame = document.getElementById("passageFrame");
  frame.src = "passage.html" + (qs ? "?" + qs : "");
})();
</script>
</body>
</html>
