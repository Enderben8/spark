<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Founding of Millbrook (canvas)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<script src="auth-guard.js"></script>
</head>
<body>
<nav class="top-links"><a href="index.html">Fixture site index</a></nav>

<header class="page-header">
  <h1>The Founding of Millbrook</h1>
  <p><em>This page renders the passage entirely on a &lt;canvas&gt; — there is
     no selectable passage text in the DOM. This is the OCR test case.</em></p>
</header>

<main>
  <canvas id="passageCanvas" class="passage-canvas" aria-label="Passage text rendered as an image; see the plain-DOM version at passage.html for the same text."></canvas>
</main>

<footer class="page-footer">
  <a id="nextBtn" class="btn" href="questions.html?set=1&amp;round=1">Next</a>
</footer>

<script src="passage-data.js"></script>
<script src="canvas-passage.js"></script>
<script src="round-nav.js"></script>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("passageCanvas");
  var width = Math.min(760, Math.max(320, window.innerWidth - 40));
  SparkCanvasPassage.renderPassageSingleColumn(canvas, {
    paragraphs: PASSAGE_PARAGRAPHS,
    title: PASSAGE_TITLE,
    width: width,
    fontSize: 20,
    fontFamily: "sans-serif"
  });

  var round = getRound();
  document.getElementById("nextBtn").href = questionsHrefForRound(round);
})();
</script>
</body>
</html>
