<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — Spark fixture site</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="top-links"><a href="index.html">Fixture site index</a></nav>

<main>
  <form class="login-form" id="loginForm" autocomplete="off">
    <h1>Sign in</h1>
    <p>This is a fake login for the Spark test fixture. Any non-empty
       username and password are accepted — nothing is actually checked.</p>

    <label for="username">Username</label>
    <input type="text" id="username" name="username" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <p style="margin-top:18px;">
      <button type="submit" class="btn">Sign in</button>
    </p>
  </form>
</main>

<script>
(function () {
  "use strict";
  var form = document.getElementById("loginForm");
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var username = document.getElementById("username").value.trim();
    var password = document.getElementById("password").value.trim();
    if (!username || !password) {
      return;
    }
    // Fake session: just drop a cookie. No credentials are checked,
    // stored, or sent anywhere.
    document.cookie = "spark_fixture_session=1; path=/";

    var params = new URLSearchParams(window.location.search);
    var next = params.get("next") || "passage.html";
    window.location.href = next;
  });
})();
</script>
</body>
</html>
