[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spark"
version = "0.1.0"
description = "AI-driven Windows desktop assistant that reads a web page, clicks through it, and answers questions grounded in what it read."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.45",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "Pillow>=10.3",
    "PyYAML>=6.0",
    "keyring>=25.2",
    "PySide6>=6.7",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.3"]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.35"]
ollama = ["httpx>=0.27"]
# NOTE: winsdk has not been updated since 2023-08 (v1.0.0b10) — the pywinrt
# project's actively-maintained bindings moved to modular winrt-* packages
# instead (e.g. winrt-Windows.Media.Ocr). See
# src/spark/perception/ocr/WINDOWS_OCR_NOTES.md for the full finding. Verify
# winsdk still installs/works on a real target machine before shipping; the
# WinRT namespace/API used in windows.py is identical either way, so only
# this pin (and windows.py's import lines) would need to change.
windows-ocr = ["winsdk>=1.0.0b10; platform_system == 'Windows'"]
tesseract = ["pytesseract>=0.3.10"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pyinstaller>=6.8",
]

[project.scripts]
spark = "spark.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spark = ["perception/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: requires a real provider API key; skipped by default",
]
testpaths = ["tests"]
